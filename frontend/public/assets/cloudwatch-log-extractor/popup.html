<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MVAX Log → cURL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 520px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e2e;
      color: #cdd6f4;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f38ba8;
      text-align: center;
    }
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #pasteBtn {
      background: #f38ba8;
      color: #1e1e2e;
    }
    #pasteBtn:hover { background: #f5a0b8; }
    #copyBtn {
      background: #a6e3a1;
      color: #1e1e2e;
    }
    #copyBtn:hover { background: #b8eab4; }
    #copyBtn:disabled {
      background: #45475a;
      color: #6c7086;
      cursor: not-allowed;
    }
    #status {
      font-size: 12px;
      margin-bottom: 8px;
      min-height: 18px;
      text-align: center;
    }
    #status.error { color: #f38ba8; }
    #status.success { color: #a6e3a1; }
    #output {
      width: 100%;
      min-height: 180px;
      max-height: 350px;
      background: #181825;
      color: #a6e3a1;
      border: 1px solid #313244;
      border-radius: 6px;
      padding: 10px;
      font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      font-size: 11.5px;
      line-height: 1.5;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <h1>MVAX Log → cURL</h1>
  <div class="btn-row">
    <button id="pasteBtn">📋 Paste from Clipboard</button>
    <button id="copyBtn" disabled>📄 Copy cURL</button>
  </div>
  <div id="status"></div>
  <pre id="output">Click "Paste from Clipboard" with an MVAX_AUDIT log line copied.</pre>
  <script src="curl-printer.js"></script>
  <script src="popup.js"></script>
</body>
</html>

<div class="app-shell">
  <header class="app-header">
    <div class="header-left">
      <div class="logo-mark">
        <!-- _VOIS (Vodafone) logo -->
        <svg width="80" height="32" viewBox="0 0 80 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- _VOIS text -->
          <text x="35" y="21" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#E60000" letter-spacing="-0.5">_VOIS</text>
        </svg>
      </div>
      <div class="header-text">
        <h1>{{ title }}</h1>
        <span class="header-subtitle">Environment Management</span>
      </div>
    </div>
    <button class="settings-btn" (click)="toggleSettings()" title="Settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <path d="M10 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Z" stroke="currentColor" stroke-width="1.5"/>
        <path d="M16.2 12.5a1.4 1.4 0 0 0 .28 1.54l.05.05a1.7 1.7 0 1 1-2.4 2.4l-.06-.05a1.4 1.4 0 0 0-1.53-.28 1.4 1.4 0 0 0-.85 1.28v.14a1.7 1.7 0 1 1-3.4 0v-.08A1.4 1.4 0 0 0 7.38 16.2a1.4 1.4 0 0 0-1.54.28l-.05.05a1.7 1.7 0 1 1-2.4-2.4l.05-.06a1.4 1.4 0 0 0 .28-1.53 1.4 1.4 0 0 0-1.28-.85H2.3a1.7 1.7 0 1 1 0-3.4h.08A1.4 1.4 0 0 0 3.66 7.38a1.4 1.4 0 0 0-.28-1.54l-.05-.05a1.7 1.7 0 1 1 2.4-2.4l.06.05a1.4 1.4 0 0 0 1.53.28h.07a1.4 1.4 0 0 0 .85-1.28V2.3a1.7 1.7 0 0 1 3.4 0v.08a1.4 1.4 0 0 0 .85 1.28 1.4 1.4 0 0 0 1.53-.28l.06-.05a1.7 1.7 0 1 1 2.4 2.4l-.06.06a1.4 1.4 0 0 0-.27 1.53v.07a1.4 1.4 0 0 0 1.27.85h.15a1.7 1.7 0 0 1 0 3.4h-.08a1.4 1.4 0 0 0-1.28.85Z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </header>

  <!-- Settings Modal -->
  <app-settings *ngIf="showSettings" (closed)="showSettings = false"></app-settings>

  <nav class="tabs">
    <a
      class="tab"
      [class.active]="isActive('reservations')"
      routerLink="/reservations"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M1 6h14M5 2v2M11 2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Reservations
    </a>
    <a
      class="tab"
      [class.active]="isActive('deploy-branch')"
      routerLink="/deploy-branch"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 2v9M5 9l3 3 3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M2 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Deploy Branch
    </a>
    <a
      class="tab"
      [class.active]="isActive('pipeline')"
      routerLink="/pipeline"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="5" cy="4" r="1.2" fill="currentColor"/>
        <circle cx="10" cy="8" r="1.2" fill="currentColor"/>
        <circle cx="7" cy="12" r="1.2" fill="currentColor"/>
      </svg>
      Release CUT-OFF
    </a>
    <a
      class="tab"
      [class.active]="isActive('tools')"
      routerLink="/tools"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M9.8 4.2a1 1 0 0 0 0 1l1 1a1 1 0 0 0 1 0l2.5-2.5a4 4 0 0 1-5.3 5.3l-4.6 4.6a1.4 1.4 0 0 1-2-2L7 7a4 4 0 0 1 5.3-5.3L9.8 4.2z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Tools
    </a>
    <a
      class="tab"
      [class.active]="isActive('resources')"
      routerLink="/resources"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="9" y="1" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="1" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
        <rect x="9" y="9" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
      </svg>
      VOIS Resources
    </a>
  </nav>

  <main class="tab-content">
    <router-outlet />
  </main>
</div>

<div class="app-shell">
  <header class="app-header">
    <div class="header-left">
      <div class="logo-mark">
        <!-- _VOIS (Vodafone) logo -->
        <svg width="80" height="32" viewBox="0 0 80 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- _VOIS text -->
          <text x="35" y="21" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#E60000" letter-spacing="-0.5">_VOIS</text>
        </svg>
      </div>
      <div class="header-text">
        <h1>{{ title }}</h1>
        <span class="header-subtitle">Environment Management</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button
      class="tab"
      [class.active]="activeTab === 'reservation'"
      (click)="setTab('reservation')"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="2" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.5"/>
        <path d="M1 6h14M5 2v2M11 2v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Reservations
    </button>
    <button
      class="tab"
      [class.active]="activeTab === 'placeholder'"
      (click)="setTab('placeholder')"
    >
      <svg class="tab-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
        <rect x="1" y="1" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/>
        <path d="M5 8h6M8 5v6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      Tab 2
    </button>
  </nav>

  <main class="tab-content">
    @if (activeTab === 'reservation') {
      <app-environment-reservation />
    } @else {
      <app-placeholder />
    }
  </main>
</div>

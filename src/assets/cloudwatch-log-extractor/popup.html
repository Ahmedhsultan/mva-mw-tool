<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudWatch Log Extractor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 480px;
      min-height: 200px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1.5px solid #e2e8f0;
    }

    .header svg { color: #E60000; flex-shrink: 0; }

    .header h1 {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
    }

    .header p {
      font-size: 11px;
      color: #64748b;
      margin-top: 2px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 18px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
      width: 100%;
    }

    .btn-primary {
      background: #E60000;
      color: #fff;
    }

    .btn-primary:hover { background: #cc0000; }

    .btn-secondary {
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #e2e8f0;
      margin-top: 8px;
    }

    .btn-secondary:hover { background: #e2e8f0; }

    .result-box {
      margin-top: 12px;
      background: #1e293b;
      border-radius: 8px;
      padding: 12px;
      max-height: 300px;
      overflow: auto;
      display: none;
    }

    .result-box.show { display: block; }

    .result-box pre {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      font-size: 11px;
      color: #e2e8f0;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
    }

    .status {
      margin-top: 10px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      display: none;
    }

    .status.show { display: block; }
    .status.success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .status.error { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      margin-top: 12px;
    }

    .extracted-field {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .extracted-field .label {
      font-size: 11px;
      font-weight: 600;
      color: #64748b;
      min-width: 90px;
      flex-shrink: 0;
    }

    .extracted-field .value {
      font-size: 12px;
      color: #1e293b;
      word-break: break-all;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
    </svg>
    <div>
      <h1>CloudWatch Log Extractor</h1>
      <p>Paste or read from clipboard to extract cURL & log details</p>
    </div>
  </div>

  <button class="btn btn-primary" id="extractBtn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
    Extract from Clipboard
  </button>

  <button class="btn btn-secondary" id="copyBtn" style="display:none;">
    Copy cURL Command
  </button>

  <div class="status" id="status"></div>

  <div id="fieldsContainer"></div>

  <div class="result-box" id="resultBox">
    <pre id="resultPre"></pre>
  </div>

  <script src="popup.js"></script>
</body>
</html>
